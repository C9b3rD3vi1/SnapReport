services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - generated:/app/generated
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/snapreport.db
      - UPLOAD_DIR=/app/uploads
      - PDF_DIR=/app/generated
      - ENVIRONMENT=production
    restart: unless-stopped

volumes:
  data:
  uploads:
  generated:
